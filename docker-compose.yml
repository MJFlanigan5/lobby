services:
  lobby:
    build: .
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - ./config:/app/config
    environment:
      - PORT=3000
      - PLEX_URL=${PLEX_URL}
      - PLEX_TOKEN=${PLEX_TOKEN}
      - JELLYFIN_URL=${JELLYFIN_URL:-}
      - JELLYFIN_API_KEY=${JELLYFIN_API_KEY:-}
      - SONARR_URL=${SONARR_URL:-}
      - SONARR_API_KEY=${SONARR_API_KEY:-}
      - RADARR_URL=${RADARR_URL:-}
      - RADARR_API_KEY=${RADARR_API_KEY:-}
      - GOVEE_IP=${GOVEE_IP:-}
      - GOVEE_DEVICE_ID=${GOVEE_DEVICE_ID:-}
      - LATITUDE=${LATITUDE:-}
      - LONGITUDE=${LONGITUDE:-}
      - TEMP_UNIT=${TEMP_UNIT:-fahrenheit}
      - SCHEDULE_CS_DAY=${SCHEDULE_CS_DAY:-}
      - SCHEDULE_CS_HOUR=${SCHEDULE_CS_HOUR:-18}
      - SCHEDULE_AUTO_DAY=${SCHEDULE_AUTO_DAY:-}
      - SCHEDULE_AUTO_HOUR=${SCHEDULE_AUTO_HOUR:-6}
