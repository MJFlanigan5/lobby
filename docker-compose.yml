services:
  lobby:
    build: .
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - ./config:/app/config
    environment:
      - PORT=3000
      - PLEX_URL=${PLEX_URL:-}
      - PLEX_TOKEN=${PLEX_TOKEN:-}
      - JELLYFIN_URL=${JELLYFIN_URL:-}
      - JELLYFIN_API_KEY=${JELLYFIN_API_KEY:-}
      - SONARR_URL=${SONARR_URL:-}
      - SONARR_API_KEY=${SONARR_API_KEY:-}
      - RADARR_URL=${RADARR_URL:-}
      - RADARR_API_KEY=${RADARR_API_KEY:-}
      - GOVEE_IP=${GOVEE_IP:-}
      - GOVEE_DEVICE_ID=${GOVEE_DEVICE_ID:-}
      - HA_URL=${HA_URL:-}
      - HA_TOKEN=${HA_TOKEN:-}
      - HA_LIGHT_ENTITY_ID=${HA_LIGHT_ENTITY_ID:-}
      - HUE_BRIDGE_IP=${HUE_BRIDGE_IP:-}
      - HUE_USERNAME=${HUE_USERNAME:-}
      - HUE_LIGHT_ID=${HUE_LIGHT_ID:-}
      - LIFX_TOKEN=${LIFX_TOKEN:-}
      - LIFX_SELECTOR=${LIFX_SELECTOR:-}
      - SONOS_IP=${SONOS_IP:-}
      - SONOS_DUCK_VOLUME=${SONOS_DUCK_VOLUME:-15}
      - LATITUDE=${LATITUDE:-}
      - LONGITUDE=${LONGITUDE:-}
      - LOCATION=${LOCATION:-}
      - TEMP_UNIT=${TEMP_UNIT:-fahrenheit}
      - TIMEZONE=${TIMEZONE:-America/New_York}
      - SCHEDULE_CS_DAY=${SCHEDULE_CS_DAY:-}
      - SCHEDULE_CS_HOUR=${SCHEDULE_CS_HOUR:-18}
      - SCHEDULE_AUTO_DAY=${SCHEDULE_AUTO_DAY:-}
      - SCHEDULE_AUTO_HOUR=${SCHEDULE_AUTO_HOUR:-6}
      - SCHEDULE_SLEEP_DAY=${SCHEDULE_SLEEP_DAY:-}
      - SCHEDULE_SLEEP_HOUR=${SCHEDULE_SLEEP_HOUR:-23}
      - SCHEDULE_WAKE_DAY=${SCHEDULE_WAKE_DAY:-}
      - SCHEDULE_WAKE_HOUR=${SCHEDULE_WAKE_HOUR:-7}
      - SLIDESHOW_INTERVAL=${SLIDESHOW_INTERVAL:-20}
      - CLOCK_FORMAT=${CLOCK_FORMAT:-12h}
      - LIBRARY_FILTER=${LIBRARY_FILTER:-all}
      - SHOW_WEATHER=${SHOW_WEATHER:-true}
      - SHOW_CLOCK=${SHOW_CLOCK:-true}
      - SHOW_TITLES=${SHOW_TITLES:-true}
      - DISPLAY_NAME=${DISPLAY_NAME:-LOBBY}
      - THEME_MUSIC_ENABLED=${THEME_MUSIC_ENABLED:-false}
